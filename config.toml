# [widgets.system_monitor]
# Alert-only: invisible while healthy, fades in once a threshold is crossed.
# cpu_threshold = 90
# memory_threshold = 85
# disk_threshold = 90
# interval = 5
# tooltip = "System load"

# [widgets.headset]
# interval = 5
