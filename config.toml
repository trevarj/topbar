# max_chars = 12
# command = "headsetcontrol"

# [widgets.keyboard_layout]
# show_icon = true
# show_label = true
# format = "short"       # "short" (US) or "long" (English (US))

# [widgets.quick_settings]
# Card toggles — set any to false to hide that row.
# network = true
# bluetooth = true
# vpn = true
#   Lists every NetworkManager VPN and WireGuard profile and switches them.
#   A profile whose secrets are stored — WireGuard keys, or an OpenVPN
#   password in the keyring — connects from the panel. One that wants a
#   password typed in each time does not: answering that means running the
#   plugin's own auth-dialog binary, which topbar does not do. Such a profile
#   reports "Could not change the network" under its row; connect it once with
#   nm-applet or `nmcli` and let NetworkManager store the secret.
# idle_inhibitor = true
# updates = true
# audio = true
# mic = "auto"                  # "auto" (while recording), "always", "never"
# brightness = true
# power = true
# battery = true                # Battery pill in the panel indicator
# battery_health = true
# resource_overview = true
# vpn_close_on_connect = true
# audio_scroll_percentage = 5   # Volume change per scroll tick, 1 to 25

# [widgets.os_logo]
# tooltip = "NixOS"
# label = ""
# max_chars = 4

# Script-backed indicators use the custom- prefix and are placed by full name:
#   left = ["workspaces", "custom-vpn"]
#
# [widgets.custom-vpn]
# exec = "~/bin/vpn-status"   # First stdout line, or Waybar-style JSON
# interval = 60               # Seconds between runs; 0 runs once at startup
# template = "VPN {output}"   # Must contain {output}
# icon = "network-vpn-symbolic"
# label = "off"               # Fallback text before the first run
# tooltip = "VPN status"
# max_chars = 20
# requires_network = false    # Wait for a live connection before running exec
# on_click = "nm-connection-editor"

[theme]
# Genuine "dark" or "light" mode; neutral defaults follow the selected mode.
mode = "dark"
accent = "#3584e4" # A hex color, or "none" for monochrome
animations = true  # Master switch for transitions and animations
ripple = true      # Material-style ripple on press
blur = false       # Ask the compositor to blur behind panel surfaces

# Optional neutral roles, accepting #rgb or #rrggbb (no alpha or "none").
# Dark defaults: #000000 / #1e1e22 / #ffffff
# Light defaults: #ffffff / #f1f1f3 / #000000
# [theme.palette]
# background = "#000000"
# surface = "#1e1e22"
# foreground = "#ffffff"

[theme.icons]
theme = "Adwaita" # GTK icon theme name
weight = 400      # Symbolic icon stroke weight hint

[theme.states]
success = "#4a7a4a"
warning = "#e5c07b"
urgent = "#ff6b6b"

[theme.typography]
font_family = "Adwaita Sans, Cantarell, Noto Sans, sans-serif"

[osd]
enabled = true
position = "bottom" # "bottom", "top", "left", or "right"
show_value = false  # Draw the numeric value next to the bar
timeout_ms = 1500

[audio]
# Allow volume above 100%, capped at PulseAudio's recommended UI maximum.
allow_overdrive = false

[updates]
# With no command set, the pending-updates card deduces a read-only counting
# command from /etc/os-release. Nothing it runs syncs a package database,
# takes a lock or downloads anything:
#
#   guix        guix upgrade --dry-run
#   debian      apt-get -s -o Debug::NoLocking=true upgrade   (Ubuntu, Mint, …)
#   arch        checkupdates                (needs pacman-contrib; Manjaro, …)
#   fedora      dnf -q check-update                           (Nobara, RHEL, …)
#   silverblue  rpm-ostree upgrade --check          (Kinoite, Sericea, uBlue)
#
#   nixos       copies flake.nix and flake.lock into a scratch directory,
#               runs `nix flake update` against the copy, and counts the
#               inputs whose pin moved. The system's own lock file is never
#               written. The flake is assumed at /etc/nixos; if yours lives
#               in a dotfiles checkout, point `flake` at it:
#
# flake = "~/dotfiles/nixos"   # NixOS only: where the system flake lives
#
# The card is hidden when the count is zero and when counting fails.
check_interval = 3600 # Seconds between checks (minimum 60)
# The override wins over all of the above, runs through a shell so pipelines
# work, and must print either a number, or one pending update per line.
# update_count_command = "checkupdates | wc -l"

[advanced]
compositor = "auto"          # Startup-only: "auto" or "niri"
pango_font_rendering = false # Apply Pango font attributes instead of GTK CSS
