# =============================================================================
# topbar configuration
# =============================================================================
#
# This file is the built-in default, compiled into the binary. Your own config
# lives at ~/.config/topbar/config.toml and only needs the keys you want to
# change — every unset key falls back to the value shown here.
#
#   topbar --check-config          Validate configuration and exit
#   topbar --print-example-config  Print this file
#
# =============================================================================

[bar]
# v2 draws a GNOME Shell-style top panel. "top" is the only supported position.
position = "top"
size = 36            # Bar height in pixels
spacing = 2          # Gap between widgets
screen_margin = 0    # Gap between the screen edge and the bar window
inset = 4            # Gap between the bar edge and the first/last section
padding = 0          # Extra vertical padding inside the bar
border_radius = 0    # Bar corner radius in pixels
popover_offset = 1   # Gap between the bar and popovers anchored to it
# background_color = "#000000" # Optional override; unset inherits theme.palette.background
background_opacity = 1.0

[widgets]
# Placement. Available widgets: workspaces, clock, weather, crypto, tray,
# system_monitor, headset, keyboard_layout, quick_settings, os_logo, and any
# number of custom-<name> script widgets.
left = ["workspaces"]
center = ["clock"]
right = ["tray", "quick_settings"]

border_radius = 50       # Widget corner radius, as a percentage of height
background_opacity = 0.0 # Panel buttons are transparent until hovered
# background_color = "#1a1a1a"       # Override the widget surface color
# popover_background_opacity = 0.76  # Defaults to the bar's opacity

# Every widget accepts on_click, on_click_right and on_click_middle, but only
# the widgets with nothing of their own to do with that button act on them:
# left click on headset, os_logo and custom-*; right and middle on those plus
# quick_settings and system_monitor. A widget whose click already opens
# something — the clock, the weather, the tray — keeps doing that.

[widgets.workspaces]
label_type = "none"     # "none" (dots), "index", or "name"
filter_by_output = true # Show only this monitor's workspaces
show_unoccupied = false # Hide empty workspaces; named ones always show
# animate = true        # Defaults to theme.animations

[widgets.clock]
format = "%a %b %-d  %H:%M"
control_panel = false   # Open the notifications/calendar panel on click
show_week_numbers = true
# world_clocks = [
#   { label = "New York", timezone = "America/New_York" },
#   { label = "UTC", timezone = "Etc/UTC" },
# ]

# [widgets.weather]
