[workspace]
resolver = "2"
members = ["crates/topbar", "crates/topbar-core", "crates/topbar-services"]

[workspace.package]
version = "2.0.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/trevarj/topbar"
authors = ["Trevor Arjeski <tmarjeski@gmail.com>"]

[workspace.dependencies]
# Internal crates
topbar-core = { path = "crates/topbar-core" }
topbar-services = { path = "crates/topbar-services" }

# Async runtime and D-Bus
zbus = { version = "5.18", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = [
  "rt-multi-thread",
  "sync",
  "net",
  "process",
  "time",
  "io-util",
  "macros",
  "signal",
] }
tokio-util = { version = "0.7", features = ["codec"] }
# `sink` is not a default feature, and every framed protocol needs SinkExt.
futures-util = { version = "0.3", features = ["sink"] }

# Compositor / desktop protocols
niri-ipc = "=26.4.0"
libpulse-binding = "2.30"

# Serialization and config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
notify = "8.2"

# Time
chrono = { version = "0.4", default-features = false, features = [
  "clock",
  "std",
] }
chrono-tz = "0.10"

# CLI, errors, logging
clap = { version = "4.5", default-features = false, features = [
  "std",
  "derive",
  "help",
  "usage",
  "error-context",
] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Screen-share detection. The `pipewire` crate binds the C client library,
# and libspa-sys generates its bindings with bindgen — which is why the flake
# carries `rustPlatform.bindgenHook`: without it `libclang` is not found, and
# without the glibc headers it finds it and then cannot parse `inttypes.h`.
pipewire = "0.9"

# Networking and system
minreq = { version = "2.14", features = ["https-rustls"] }
udev = "0.9"
libc = "0.2"

# GTK stack
gtk4 = { version = "0.11", features = ["v4_18"] }
gio = "0.22"
gtk4-layer-shell = "0.8"
gdk4-wayland = { version = "0.11", features = ["wayland_crate"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
