[package]
name = "topbar-services"
description = "Async system services (D-Bus, niri, audio) for topbar; never depends on GTK"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Builds the `topbar-fake-player` test-support binary and the module behind
# it. Never enabled for the packaged panel; the visual smoke run turns it on
# to put players on its private bus.
fake-player = []
# The same arrangement for the tray: `topbar-fake-sni` puts a
# StatusNotifierItem with a real dbusmenu on the smoke run's private bus.
fake-sni = []
# And for power: `topbar-fake-power` serves a UPower and a power-profiles
# daemon, because the real ones live on the *system* bus and a smoke run must
# never so much as look at that.
fake-power = []
# And for BlueZ: `topbar-fake-bluez` serves an adapter, its paired devices
# and an agent manager, so the Bluetooth scenarios (including a pairing the
# panel did not start) can be driven without going anywhere near the machine's
# real one — which is the developer's headphones.
fake-bluez = []
# And for the network: `topbar-fake-nm` serves a NetworkManager — devices,
# access points, a settings store, an agent manager — so the Wi-Fi and VPN
# scenarios can be driven without going anywhere near the machine's real one.
fake-nm = []

[[bin]]
name = "topbar-fake-player"
path = "src/bin/fake_player.rs"
required-features = ["fake-player"]

[[bin]]
name = "topbar-fake-sni"
path = "src/bin/fake_sni.rs"
required-features = ["fake-sni"]

[[bin]]
name = "topbar-fake-power"
path = "src/bin/fake_power.rs"
required-features = ["fake-power"]

[[bin]]
name = "topbar-fake-bluez"
path = "src/bin/fake_bluez.rs"
required-features = ["fake-bluez"]

[[bin]]
name = "topbar-fake-nm"
path = "src/bin/fake_nm.rs"
required-features = ["fake-nm"]

[dependencies]
topbar-core = { workspace = true }
futures-util = { workspace = true }
gio = { workspace = true }
libc = { workspace = true }
libpulse-binding = { workspace = true }
minreq = { workspace = true }
niri-ipc = { workspace = true }
pipewire = { workspace = true }
udev = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs"] }
toml = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
zbus = { workspace = true }
